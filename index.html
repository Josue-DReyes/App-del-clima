<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App del clima</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="/img/favicon/favicon-96x96.png" sizes="96x96" />
</head>

<body>
    <div class="container my-5" style="max-width: 500px;">
        <h1 class="text-center title mb-4">El clima en:</h1>

        <form class="search-loaction">
            <input type="search" name="city" placeholder="El clima en..." autocomplete="off"
                class="form-control text-muted form-rounded p-4 shadow-sm" />
        </form>

        <div id="main-card" class="card rounded my-3 shadow-lg back-card d-none">
            <div class="card-top text-center">
                <div class="city-name my-3">
                    <p>Honduras</p>
                    <span>...</span>
                </div>
                <img src="img/night_image.svg" alt="" class="card-img-top time" />
            </div>

            <div class="card-body">
                </div>
        </div>

        <div id="forecast-section" class="d-none">
            <h3 class="text-center mt-4 mb-3" style="font-size: 1.2rem;">Pronóstico de los siguientes 7 días:</h3>
            <div class="card rounded shadow-lg back-card">
                <div id="forecast" class="p-0">
                    </div>
            </div>
        </div>

    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/request.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
